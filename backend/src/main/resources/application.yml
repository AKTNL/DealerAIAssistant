server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: agent-poc-backend
  ai:
    chat:
      observations:
        include-error-logging: false
        log-prompt: false
        log-completion: false
  datasource:
    url: jdbc:h2:mem:agentpoc;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  flyway:
    enabled: false

app:
  auth:
    access-token-ttl: ${APP_AUTH_ACCESS_TOKEN_TTL:30m}
    refresh-token-ttl: ${APP_AUTH_REFRESH_TOKEN_TTL:7d}
    cookie-secure: ${APP_AUTH_COOKIE_SECURE:false}
    cookie-same-site: ${APP_AUTH_COOKIE_SAME_SITE:Lax}
    bootstrap:
      required: ${APP_AUTH_BOOTSTRAP_REQUIRED:false}
      username: ${APP_AUTH_BOOTSTRAP_USERNAME:}
      password: ${APP_AUTH_BOOTSTRAP_PASSWORD:}
      display-name: ${APP_AUTH_BOOTSTRAP_DISPLAY_NAME:System Administrator}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  excel:
    path: ${APP_EXCEL_PATH:classpath:Sample Data.xlsx}
    fallback-enabled: ${APP_EXCEL_FALLBACK_ENABLED:true}
  model:
    base-url: ${APP_MODEL_BASE_URL:}
    api-key: ${APP_MODEL_API_KEY:}
    name: ${APP_MODEL_NAME:}
    allowed-hosts: ${APP_MODEL_ALLOWED_HOSTS:}
    allow-private-hosts: ${APP_MODEL_ALLOW_PRIVATE_HOSTS:false}
    secret-key: ${APP_MODEL_SECRET_KEY:}
  knowledge:
    vector-store: ${APP_KNOWLEDGE_VECTOR_STORE:memory}
    schema-name: ${APP_KNOWLEDGE_SCHEMA_NAME:public}
    table-name: ${APP_KNOWLEDGE_TABLE_NAME:knowledge_vector_store}
    dimensions: ${APP_KNOWLEDGE_EMBEDDING_DIMENSIONS:1536}
    similarity-threshold: ${APP_KNOWLEDGE_SIMILARITY_THRESHOLD:0.45}
  reporting:
    jobs:
      enabled: ${APP_REPORTING_JOBS_ENABLED:false}
      poll-interval: ${APP_REPORTING_JOBS_POLL_INTERVAL:30s}
  notification:
    secret-key: ${APP_NOTIFICATION_SECRET_KEY:}
    smtp-allowed-hosts: ${APP_NOTIFICATION_SMTP_ALLOWED_HOSTS:}
    smtp-connection-timeout: ${APP_NOTIFICATION_SMTP_CONNECTION_TIMEOUT:5s}
    smtp-read-timeout: ${APP_NOTIFICATION_SMTP_READ_TIMEOUT:10s}
    smtp-write-timeout: ${APP_NOTIFICATION_SMTP_WRITE_TIMEOUT:5s}
    max-message-bytes: ${APP_NOTIFICATION_MAX_MESSAGE_BYTES:262144}

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,metrics,prometheus}
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:0.1}
    propagation:
      produce: W3C
      consume: W3C,B3,B3_MULTI
  otlp:
    tracing:
      export:
        enabled: ${MANAGEMENT_OTLP_TRACING_EXPORT_ENABLED:false}
      endpoint: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
      connect-timeout: ${MANAGEMENT_OTLP_TRACING_CONNECT_TIMEOUT:5s}
      timeout: ${MANAGEMENT_OTLP_TRACING_TIMEOUT:10s}
  observations:
    key-values:
      service: ${spring.application.name}

springdoc:
  swagger-ui:
    url: /openapi.json
    path: /swagger-ui.html

logging:
  level:
    com.brand.agentpoc: INFO
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-},%X{requestId:-}] "
  include-application-name: false
