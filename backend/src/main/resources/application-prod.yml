spring:
  datasource:
    url: ${APP_DB_URL:jdbc:postgresql://localhost:5432/agentpoc}
    username: ${APP_DB_USERNAME:agentpoc}
    password: ${APP_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/postgresql
    validate-on-migrate: true
    clean-disabled: true

app:
  auth:
    cookie-secure: ${APP_AUTH_COOKIE_SECURE:true}
    bootstrap:
      required: ${APP_AUTH_BOOTSTRAP_REQUIRED:true}
  excel:
    fallback-enabled: false
  knowledge:
    vector-store: ${APP_KNOWLEDGE_VECTOR_STORE:pgvector}
  reporting:
    jobs:
      enabled: ${APP_REPORTING_JOBS_ENABLED:true}
