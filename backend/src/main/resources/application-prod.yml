spring:
  ai:
    model:
      embedding: openai
  datasource:
    url: ${APP_DB_URL:jdbc:postgresql://localhost:5432/agentpoc}
    username: ${APP_DB_USERNAME:agentpoc}
    password: ${APP_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/postgresql
    validate-on-migrate: true
    clean-disabled: true

app:
  auth:
    cookie-secure: ${APP_AUTH_COOKIE_SECURE:true}
    bootstrap:
      required: ${APP_AUTH_BOOTSTRAP_REQUIRED:true}
  excel:
    fallback-enabled: false
  knowledge:
    vector-store: ${APP_KNOWLEDGE_VECTOR_STORE:pgvector}
  reporting:
    jobs:
      enabled: ${APP_REPORTING_JOBS_ENABLED:true}
  notification:
    secret-key: ${APP_NOTIFICATION_SECRET_KEY:}
    smtp-allowed-hosts: ${APP_NOTIFICATION_SMTP_ALLOWED_HOSTS:}
    smtp-connection-timeout: ${APP_NOTIFICATION_SMTP_CONNECTION_TIMEOUT:5s}
    smtp-read-timeout: ${APP_NOTIFICATION_SMTP_READ_TIMEOUT:10s}
    smtp-write-timeout: ${APP_NOTIFICATION_SMTP_WRITE_TIMEOUT:5s}
    max-message-bytes: ${APP_NOTIFICATION_MAX_MESSAGE_BYTES:262144}

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info}

logging:
  structured:
    format:
      console: ${LOGGING_STRUCTURED_FORMAT_CONSOLE:logstash}
