global:
  resolve_timeout: 5m

route:
  receiver: operations-webhook
  group_by:
    - alertname
    - service
    - cluster
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: operations-webhook
      matchers:
        - severity="critical"
      repeat_interval: 1h

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal:
      - service
      - cluster
      - instance

receivers:
  - name: operations-webhook
    webhook_configs:
      - url_file: /etc/alertmanager/secrets/operations-webhook-url
        send_resolved: true
